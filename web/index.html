<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jira-lite</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%235e69d1'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/list.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/icons.css">
<link rel="stylesheet" href="css/detail.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/auth.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<nav id="side"></nav>
<div id="frame">
  <div id="top">
    <span id="title">My issues</span><span id="count"></span>
    <span class="seg" role="group" aria-label="View">
      <button id="vList" aria-pressed="true" title="List view (⌘B)">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h10"/></svg><span class="lbl">List</span></button>
      <button id="vBoard" aria-pressed="false" title="Board view (⌘B)">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="4" height="11" rx="1.2"/><rect x="10" y="2.5" width="4" height="7" rx="1.2"/></svg><span class="lbl">Board</span></button>
    </span>
    <span class="spacer"></span>
    <span class="qwrap">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input id="q" placeholder="Filter  /" autocomplete="off" spellcheck="false">
    </span>
    <span id="updated"></span>
    <button class="btn" id="showDone" aria-pressed="false" title="Show Done tickets">Show done</button>
    <button class="btn icon" id="refresh" title="Refresh (r) · auto every 60s">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
    </button>
    <button class="btn primary" id="newBtn" title="New issue (c)">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2.5v11M2.5 8h11"/></svg>
      New issue <kbd>C</kbd>
    </button>
  </div>
  <div id="body">
    <div id="list"><p class="empty">Loading…</p></div>
    <div id="board" hidden></div>
    <aside id="detail" hidden></aside>
  </div>
</div>
<div id="toast" role="status"></div>
</body>
</html>
