<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jira-lite</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%235e69d1'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap">
<style>
  /* Tokens follow Linear's generated theme (base/accent/contrast in LCH), see README. */
  :root {
    color-scheme: light dark;  /* native scrollbars and selects follow the theme */
    --font: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --row-h: 40px;
    --ease: cubic-bezier(.25, .46, .45, .94);

    --bg-sidebar: #eeeeef; --side-hover: #e4e4e5; --side-active: #e0e0e1;
    --bg: #f8f8f9; --bg-hover: #eeeeef; --bg-group: #f1f1f2; --bg-focus: #eaeaeb;
    --bg-selected: #e7e8f3; --elevated: #ffffff; --ctrl: #fefeff; --overlay: #0000003f;
    --border: #dedede; --border-faint: #f1f1f1;
    --title: #1b1b1b; --text: #2f2f31; --muted: #5b5c5e; --faint: #9c9c9e; --link: #3f60d9;
    --accent: #6d78d5; --accent-hover: #5e69c1; --err: #d93a3e;
    --shadow-low: 0 3px 6px -2px #00000005, 0 1px 1px #0000000a;
    --shadow-med: 0 6px 18px #00000008, 0 3px 9px #0000000f, 0 1px 1px #0000000a;
    --shadow-high: 0 16px 48px #00000024, 0 4px 12px #0000000f;

    --st-backlog: #a8acb3; --st-todo: #9c9c9e; --st-started: #e5b53a; --st-review: #26a544;
    --st-blocked: #f34e52; --st-done: #5e6ad2; --st-canceled: #95a2b3; --urgent: #ff7235;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-sidebar: #09090a; --side-hover: #1d1e1f; --side-active: #28292b;
      --bg: #111212; --bg-hover: #191a1b; --bg-group: #151617; --bg-focus: #222223;
      --bg-selected: #1b1e37; --elevated: #19191b; --ctrl: #1b1b1c; --overlay: #00000080;
      --border: #232325; --border-faint: #1a1b1d;
      --title: #ffffff; --text: #e2e3e5; --muted: #949597; --faint: #6b6b6e; --link: #6f7ffe;
      --accent: #5e69d1; --accent-hover: #6974e1; --err: #f2777a;
      --shadow-low: 0 .5px 1px 1px #0000004c;
      --shadow-med: 0 3px 8px #0000001f, 0 2px 5px #0000001f, 0 1px 1px #0000001f;
      --shadow-high: 0 16px 48px #00000080, 0 4px 12px #00000040;

      --st-backlog: #bec2c8; --st-todo: #e2e2e2; --st-started: #f2c94c; --st-review: #43bc58;
      --st-blocked: #f34e52; --st-done: #5e6ad2; --st-canceled: #95a2b3;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; background: var(--bg-sidebar); color: var(--text);
    font: 450 13px/1.5 var(--font); font-feature-settings: "cv01", "ss03";
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  kbd { font: 500 11px var(--font); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--muted); background: var(--bg); }

  /* ---- sidebar ---- */
  #side { width: 244px; flex: none; display: flex; flex-direction: column; gap: 1px; padding: 10px 8px 8px; overflow: auto; }
  .ws { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; margin-bottom: 8px; font-weight: 600; color: var(--title); }
  .logo { width: 20px; height: 20px; border-radius: 5px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 600; }
  .nav { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border-radius: 6px; color: var(--muted); font-weight: 500; text-align: left; white-space: nowrap; }
  .nav:hover { background: var(--side-hover); color: var(--text); }
  .nav.on { background: var(--side-active); color: var(--title); }
  .nav span { overflow: hidden; text-overflow: ellipsis; }
  .side-h { font-size: 12px; font-weight: 500; color: var(--faint); padding: 16px 8px 4px; }
  .hints { margin-top: auto; padding: 16px 8px 4px; color: var(--faint); font-size: 12px; line-height: 2; }

  /* ---- main frame ---- */
  #frame { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; margin: 8px 8px 8px 0;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-low); }
  #top { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--border); }
  #title { font-size: 14px; font-weight: 600; color: var(--title); white-space: nowrap; }
  #count { color: var(--faint); font-weight: 500; white-space: nowrap; }
  .spacer { flex: 1; }
  #updated { color: var(--faint); font-size: 12px; margin-right: 4px; white-space: nowrap; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--ctrl); margin-left: 8px; }
  .seg button { height: 22px; padding: 0 8px; border-radius: 6px; color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
  .seg button[aria-pressed="true"] { background: var(--bg-focus); color: var(--title); }
  #q { width: 180px; height: 28px; padding: 0 10px 0 28px; border: 1px solid var(--border); border-radius: 8px; background: var(--ctrl) no-repeat 9px 50%;
    outline: 0; transition: width .15s var(--ease); }
  #q:focus { border-color: var(--accent); width: 240px; }
  .qwrap { position: relative; display: inline-flex; align-items: center; }
  .qwrap svg { position: absolute; left: 9px; color: var(--faint); pointer-events: none; }
  #sprint { height: 28px; border: 1px solid var(--border); border-radius: 8px; background: var(--ctrl); padding: 0 6px; color: var(--muted); }
  .btn { height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--ctrl); color: var(--muted); font-weight: 500; white-space: nowrap; transition: background .1s var(--ease), color .1s var(--ease); }
  .btn:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; }
  .btn[aria-pressed="true"] { background: var(--bg-selected); color: var(--title); border-color: transparent; }
  .btn.icon { width: 28px; padding: 0; justify-content: center; }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); color: #fff; }
  .btn.primary kbd { background: none; border-color: #ffffff55; color: #ffffffcc; }
  .btn:disabled { opacity: .5; cursor: default; }
  #body { flex: 1; display: flex; min-height: 0; }

  /* ---- list ---- */
  #list { flex: 1; min-width: 0; overflow: auto; padding-bottom: 32px; }
  .gh { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 20px 0 12px;
    background: var(--bg-group); color: var(--title); font-weight: 500; cursor: pointer; user-select: none; }
  .chev { color: var(--faint); transition: transform .15s var(--ease); }
  .gh.closed .chev { transform: rotate(-90deg); }
  .gcount { color: var(--faint); }
  .row { display: flex; align-items: center; gap: 10px; height: var(--row-h); padding: 0 20px 0 12px; cursor: default;
    transition: background .15s var(--ease); }
  .row.cur { background: var(--bg-hover); transition: none; }
  .row.open { background: var(--bg-selected); }
  .rid { width: 66px; flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rtitle { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--title); font-weight: 500; }
  .rright { display: flex; align-items: center; gap: 12px; flex: none; }
  .rdate { width: 48px; text-align: right; color: var(--faint); font-size: 12px; }
  .ibtn { display: grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 5px; }
  .ibtn:hover { background: var(--bg-focus); }
  .badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border: 1px solid var(--border); border-radius: 9999px;
    color: var(--muted); font-size: 11.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .empty { padding: 48px 20px; text-align: center; color: var(--faint); }

  /* ---- board ---- */
  #board { flex: 1; min-width: 0; display: flex; gap: 10px; padding: 12px 16px 16px; overflow-x: auto; overflow-y: hidden; }
  #board[hidden], #list[hidden] { display: none; }
  .col { width: 272px; flex: none; display: flex; flex-direction: column; max-height: 100%; border-radius: 10px; background: var(--bg-group); }
  .col.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .colh { display: flex; align-items: center; gap: 8px; height: 40px; flex: none; padding: 0 12px; font-weight: 500; color: var(--title); }
  .cards { display: flex; flex-direction: column; gap: 6px; padding: 0 6px 8px; overflow-y: auto; min-height: 48px; }
  .tcard { background: var(--elevated); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px 10px; box-shadow: var(--shadow-low);
    cursor: grab; user-select: none; }
  .tcard.cur { border-color: var(--bg-border-strong, #9c9c9e66); }
  .tcard.open { border-color: var(--accent); }
  .tcard.dragging { opacity: .4; }
  .tcard .top { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .tcard .t { margin: 4px 0 8px; color: var(--title); font-weight: 500; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tcard .bot { display: flex; align-items: center; gap: 6px; }
  .col.ghost { background: none; border: 1px dashed var(--border); align-items: center; justify-content: center; min-height: 120px; width: 180px; color: var(--faint); gap: 8px; }

  /* ---- icons & avatars ---- */
  .s-backlog { color: var(--st-backlog); } .s-todo { color: var(--st-todo); } .s-started { color: var(--st-started); }
  .s-review { color: var(--st-review); } .s-blocked { color: var(--st-blocked); } .s-done { color: var(--st-done); }
  .s-canceled { color: var(--st-canceled); }
  .picon { color: var(--muted); flex: none; } .p-none { color: var(--faint); } .p-urgent { color: var(--urgent); }
  .av { width: 18px; height: 18px; flex: none; border-radius: 50%; display: inline-grid; place-items: center;
    color: #fff; font-size: 8.5px; font-weight: 600; letter-spacing: 0; }
  .av.none { color: var(--faint); }

  /* ---- detail (peek) ---- */
  #detail { width: 50%; min-width: 400px; max-width: 760px; display: flex; flex-direction: column; border-left: 1px solid var(--border); background: var(--bg); }
  #detail[hidden] { display: none; }
  .dh { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 24px; border-bottom: 1px solid var(--border); color: var(--muted); }
  .dh .crumb { font-weight: 500; }
  .dscroll { flex: 1; overflow: auto; padding: 22px 32px 48px; }
  .parent { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 500; }
  .parent:hover { color: var(--title); }
  .parent span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dtitle { display: block; width: 100%; font-size: 20px; line-height: 28px; font-weight: 600; color: var(--title); margin: 0 0 14px; letter-spacing: -.01em;
    border-radius: 6px; cursor: text; }
  h1.dtitle:hover { background: var(--bg-hover); box-shadow: 0 0 0 4px var(--bg-hover); }
  textarea.dtitle { border: 0; outline: 0; background: var(--bg-hover); box-shadow: 0 0 0 4px var(--bg-hover); resize: none; padding: 0; overflow: hidden; font-family: inherit; }
  .props { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .chip { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px 0 8px; border: 1px solid var(--border);
    border-radius: 9999px; color: var(--text); font-weight: 500; background: var(--ctrl); white-space: nowrap; }
  button.chip:hover, label.chip:hover { background: var(--bg-hover); }
  .chip select { appearance: none; -webkit-appearance: none; border: 0; outline: 0; background: none; padding: 0 2px 0 0; font-weight: 500; cursor: pointer; max-width: 200px; }
  .chip.req { border-style: dashed; }
  .chip.bad { border-color: var(--err); color: var(--err); }
  .meta { color: var(--faint); font-size: 12px; margin: -8px 0 20px; }
  .sec { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--faint); margin: 26px 0 10px; }
  .sec .spacer { flex: 1; }
  .link { color: var(--muted); font-size: 12px; font-weight: 500; padding: 2px 6px; border-radius: 5px; }
  .link:hover { background: var(--bg-hover); color: var(--title); text-decoration: none; }
  .adf { color: var(--text); font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
  .adf p { margin: 0 0 10px; }
  .adf h3, .adf h4, .adf h5, .adf h6 { color: var(--title); font-weight: 600; margin: 18px 0 8px; }
  .adf ul, .adf ol { padding-left: 22px; margin: 0 0 10px; }
  .adf pre { background: var(--bg-group); border: 1px solid var(--border-faint); padding: 10px 12px; border-radius: 8px; overflow: auto; font-size: 12.5px; }
  .adf code { background: var(--bg-focus); padding: 1px 4px; border-radius: 4px; font-size: .92em; }
  .adf pre code { background: none; padding: 0; }
  .adf blockquote { border-left: 2px solid var(--border); margin: 0 0 10px; padding-left: 12px; color: var(--muted); }
  .adf hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
  .adf table { border-collapse: collapse; margin-bottom: 10px; }
  .adf td, .adf th { border: 1px solid var(--border); padding: 4px 8px; }
  .adf .panel { background: var(--bg-group); padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; }
  .adf .mention { color: var(--link); font-weight: 500; }
  .adf .att { color: var(--faint); font-size: 12px; }
  .nodesc { color: var(--faint); }
  .subs { border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .subrow { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 6px; cursor: default; }
  .subrow + .subrow { border-top: 1px solid var(--border-faint); }
  .subrow:hover { background: var(--bg-hover); }
  .subrow .rid { width: auto; min-width: 60px; }
  .card { border: 1px solid var(--border); border-radius: 9px; padding: 12px 16px 14px; margin-bottom: 10px; background: var(--ctrl); }
  .card .who { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .card .name { font-weight: 500; color: var(--title); }
  .card .when { color: var(--faint); font-size: 12px; }
  .composer { border: 1px solid var(--border); border-radius: 9px; background: var(--ctrl); padding: 10px 12px 8px; }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea { width: 100%; min-height: 64px; resize: vertical; border: 0; outline: 0; background: none; font-size: 14px; }
  .crow { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .cmsg { color: var(--faint); font-size: 12px; margin-right: auto; }

  /* ---- menus, modals, toast ---- */
  .menu { position: fixed; z-index: 30; min-width: 220px; max-width: 320px; padding: 4px; background: var(--elevated);
    border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-med); animation: pop .1s var(--ease); }
  .mlist { max-height: 320px; overflow: auto; }
  @keyframes pop { from { opacity: 0; transform: translateY(-2px); } }
  .mh { padding: 6px 8px 4px; font-size: 12px; color: var(--faint); }
  .msearch { width: 100%; height: 30px; margin: 2px 0 4px; padding: 0 8px; border: 0; border-bottom: 1px solid var(--border); background: none; outline: 0; }
  .mi { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px; border-radius: 5px; text-align: left; color: var(--text); }
  .mi.hi { background: var(--bg-focus); }
  .mi .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mi .via { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .overlay { position: fixed; inset: 0; z-index: 20; background: var(--overlay); display: flex; align-items: flex-start; justify-content: center;
    padding: 12vh 16px 16px; animation: fade .12s var(--ease); }
  @keyframes fade { from { opacity: 0; } }
  .modal { width: min(720px, 100%); background: var(--elevated); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-high);
    display: flex; flex-direction: column; max-height: 76vh; animation: pop .15s var(--ease); }
  .mhead { display: flex; align-items: center; gap: 8px; padding: 12px 12px 0 18px; color: var(--muted); font-weight: 500; }
  .mbody { padding: 12px 18px 4px; overflow: auto; }
  .ntitle { width: 100%; border: 0; outline: 0; background: none; font-size: 18px; font-weight: 600; color: var(--title); padding: 4px 0; }
  .ndesc { width: 100%; min-height: 110px; border: 0; outline: 0; background: none; resize: vertical; font-size: 14px; padding: 6px 0; }
  .mfoot { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); }
  .warn { color: var(--err); font-size: 12px; margin: 4px 0 8px; }
  .palette { width: min(640px, 100%); background: var(--elevated); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-high);
    overflow: hidden; animation: pop .15s var(--ease); }
  .pinput { width: 100%; height: 52px; padding: 0 18px; border: 0; border-bottom: 1px solid var(--border); outline: 0; background: none; font-size: 15px; }
  .plist { max-height: min(420px, 60vh); overflow: auto; padding: 6px; }
  .plist .mi { height: 38px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 8px); opacity: 0; pointer-events: none; z-index: 40;
    background: var(--elevated); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-med);
    padding: 8px 14px; max-width: min(560px, calc(100vw - 32px)); transition: opacity .15s var(--ease), transform .15s var(--ease); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { color: var(--err); }

  @media (max-width: 900px) {
    #updated, .seg .lbl { display: none; }
    #q { width: 120px; }
    #q:focus { width: 160px; }
  }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    #side { width: auto; flex: none; flex-direction: row; gap: 4px; padding: 8px; overflow-x: auto; }
    .ws, .side-h, .hints { display: none; }
    .nav { width: auto; }
    #frame { margin: 0 8px 8px; }
    #top { padding: 0 8px 0 12px; gap: 6px; }
    .qwrap, #showDone, .rdate, #newBtn kbd { display: none; }
    #detail { position: fixed; inset: 0; z-index: 5; width: auto; min-width: 0; max-width: none; border: 0; }
    .dscroll { padding: 20px 16px 40px; }
    .overlay { padding-top: 16px; }
  }
</style>
</head>
<body>
<nav id="side"></nav>
<div id="frame">
  <div id="top">
    <span id="title">My issues</span><span id="count"></span>
    <span class="seg" role="group" aria-label="View">
      <button id="vList" aria-pressed="true" title="List view (⌘B)">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h10"/></svg><span class="lbl">List</span></button>
      <button id="vBoard" aria-pressed="false" title="Board view (⌘B)">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="4" height="11" rx="1.2"/><rect x="10" y="2.5" width="4" height="7" rx="1.2"/></svg><span class="lbl">Board</span></button>
    </span>
    <span class="spacer"></span>
    <span class="qwrap">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input id="q" placeholder="Filter  /" autocomplete="off" spellcheck="false">
    </span>
    <select id="sprint" title="Sprint" hidden></select>
    <span id="updated"></span>
    <button class="btn" id="showDone" aria-pressed="false" title="Show Done tickets">Show done</button>
    <button class="btn icon" id="refresh" title="Refresh (r) · auto every 60s">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
    </button>
    <button class="btn primary" id="newBtn" title="New issue (c)">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2.5v11M2.5 8h11"/></svg>
      New issue <kbd>C</kbd>
    </button>
  </div>
  <div id="body">
    <div id="list"><p class="empty">Loading…</p></div>
    <div id="board" hidden></div>
    <aside id="detail" hidden></aside>
  </div>
</div>
<div id="toast" role="status"></div>
<script>
const FIELDS = ["summary", "status", "priority", "assignee", "updated", "issuetype", "subtasks", "parent"];
const REFRESH_MS = 60000;
const SVGNS = "http://www.w3.org/2000/svg";
const $ = (s) => document.querySelector(s);
const enc = encodeURIComponent;
let cfg = { project: "BA", site: "", board: "" };
let me = null;          // the signed-in Jira user
let people = [];
let priorities = [];    // [{id, name}]
let issueTypes = [];    // from createmeta
let statusById = new Map();
let boardCols = [];     // [{name, ids: [statusId]}] from the Jira board configuration
let sprints = [];
let issues = [];
let known = new Map();  // key -> issue, for issues opened outside the list (children, search hits)
let visible = [];       // keys shown, in order (for j/k)
let current = null;     // issue open in the detail panel
let cursor = null;      // row/card highlighted by keyboard or mouse
let menu = null;        // open popover menu
let modal = null;       // open create dialog or command palette
let listSeq = 0, detailSeq = 0, lastRefresh = 0;
let busy = false;       // a write is in flight; skip auto-refresh
const state = { who: "mine", showDone: false, collapsed: new Set(), view: "list", sprint: "", filter: "" };

// ---------- helpers ----------
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}

// Icon bodies are fixed strings built here, never user data.
function icon(size, body, cls) {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("width", size);
  s.setAttribute("height", size);
  s.setAttribute("viewBox", "0 0 " + size + " " + size);
  if (cls) s.setAttribute("class", cls);
  s.setAttribute("aria-hidden", "true");
  s.innerHTML = body;
  return s;
}
const ICONS = {
  check: '<path d="M3 7.5l2.5 2.5L11 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  plus: '<path d="M7 2.5v9M2.5 7h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  sub: '<path d="M3 2v5.5a2 2 0 0 0 2 2h4M3 4.5h6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="4.5" r="1.4" fill="currentColor"/><circle cx="10" cy="9.5" r="1.4" fill="currentColor"/>',
  up: '<path d="M7 11.5v-9M3.5 6L7 2.5 10.5 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
  close: '<path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  chev: '<path d="M5 6.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
};

async function api(path, body, method) {
  const opts = { method: method || (body !== undefined ? "POST" : "GET"), headers: { "X-Jira-Lite": "1" } };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path.startsWith("/") ? path : "/jira/" + path, opts);
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { /* non-JSON error page */ }
  if (!r.ok) {
    const parts = data ? [...(data.errorMessages || []), ...Object.entries(data.errors || {}).map(([k, v]) => k + ": " + v)] : [];
    throw new Error(parts.join("; ") || ("HTTP " + r.status + (text ? ": " + text.slice(0, 200) : "")));
  }
  return data;
}

let toastTimer;
function toast(text, isErr) {
  const t = $("#toast");
  t.textContent = text;
  t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = isErr ? "err" : ""; }, isErr ? 8000 : 2500);
}

function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 86400 * 30) return Math.floor(s / 86400) + "d ago";
  return shortDate(iso);
}

function shortDate(iso) {
  const d = new Date(iso);
  const opts = { month: "short", day: "numeric" };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "2-digit";
  return d.toLocaleDateString(undefined, opts);
}

function store(k, v) { try { localStorage.setItem("jl." + k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem("jl." + k); } catch (e) { return null; } }
function issueByKey(key) { return issues.find((i) => i.key === key) || known.get(key) || null; }
function rowFor(key) { return document.querySelector('[data-key="' + CSS.escape(key) + '"]:is(.row, .tcard)'); }
function typingIn(node) { return node instanceof Element && node.matches("input, textarea, select, [contenteditable]"); }

// ---------- status / priority / avatar ----------
const KIND_ORDER = ["started", "review", "blocked", "todo", "backlog", "done", "canceled"];
function statusKind(s) {
  const n = (s.name || "").toLowerCase();
  const cat = (s.statusCategory || {}).key;
  if (cat === "done") return /cancel|won.?t|duplicate|reject|abandon/.test(n) ? "canceled" : "done";
  if (cat === "indeterminate") return /block|hold|wait/.test(n) ? "blocked" : /review|test|qa|verif/.test(n) ? "review" : "started";
  return /backlog|icebox/.test(n) ? "backlog" : "todo";
}
// Order statuses like the Jira board's columns; statuses the board doesn't show go after, by kind.
function statusRank(s) {
  const col = boardCols.findIndex((c) => c.ids.includes(String(s.id)));
  return col >= 0 ? col : 100 + KIND_ORDER.indexOf(statusKind(s));
}

function statusIcon(s) {
  const k = statusKind(s);
  const ring = '<circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1.5"';
  const C = 2 * Math.PI * 2;  // inner pie: r=2 circle stroked 4 wide covers radius 0..4
  let b;
  if (k === "backlog") b = ring + ' stroke-dasharray="1.4 1.74"/>';
  else if (k === "done") b = '<circle cx="7" cy="7" r="6.75" fill="currentColor"/><path d="M4.4 7.2l1.8 1.8 3.5-3.7" fill="none" style="stroke:var(--bg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
  else if (k === "canceled") b = '<circle cx="7" cy="7" r="6.75" fill="currentColor"/><path d="M5 5l4 4M9 5l-4 4" style="stroke:var(--bg)" stroke-width="1.5" stroke-linecap="round"/>';
  else {
    const f = { todo: 0, started: 0.5, review: 0.75, blocked: 0.5 }[k];
    b = ring + "/>" + (f ? '<circle cx="7" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="' +
      (f * C).toFixed(3) + " " + C.toFixed(3) + '" transform="rotate(-90 7 7)"/>' : "");
  }
  return icon(14, b, "s-" + k);
}

function prioKind(p) {
  const n = p ? p.name.toLowerCase() : "";
  if (/highest|blocker|critical|urgent/.test(n)) return "urgent";
  if (/high|major/.test(n)) return "high";
  if (/medium|normal/.test(n)) return "medium";
  if (/low|minor|trivial/.test(n)) return "low";
  return "none";
}

function prioIcon(p) {
  const k = prioKind(p);
  let b;
  if (k === "none") {
    b = [1.5, 6.5, 11.5].map((x) => '<rect x="' + x + '" y="7.25" width="3" height="1.5" rx=".5" fill="currentColor"/>').join("");
  } else if (k === "urgent") {
    b = '<rect x="1" y="1" width="14" height="14" rx="3" fill="currentColor"/>' +
      '<rect x="7.25" y="4" width="1.5" height="5.5" rx=".75" style="fill:var(--bg)"/><circle cx="8" cy="11.6" r=".95" style="fill:var(--bg)"/>';
  } else {
    const lit = { high: 3, medium: 2, low: 1 }[k];
    b = [[1.5, 8, 6], [6.5, 5, 9], [11.5, 2, 12]].map(([x, y, h], i) =>
      '<rect x="' + x + '" y="' + y + '" width="3" height="' + h + '" rx="1" fill="currentColor"' + (i >= lit ? ' fill-opacity=".4"' : "") + "/>").join("");
  }
  return icon(16, b, "picon p-" + k);
}

function avatar(u) {
  if (!u) return icon(18, '<circle cx="9" cy="9" r="7.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 2"/>', "av none");
  const initials = u.displayName.split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  let h = 0;
  for (const ch of u.accountId || u.displayName) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return el("span", { class: "av", title: u.displayName, style: "background:hsl(" + h + " 45% 48%)" }, initials);
}

function subBadge(f) {
  const st = f.subtasks || [];
  if (!st.length) return null;
  const done = st.filter((s) => ((s.fields.status || {}).statusCategory || {}).key === "done").length;
  return el("span", { class: "badge", title: done + " of " + st.length + " sub-tasks done" }, icon(12, ICONS.sub, ""), done + "/" + st.length);
}

// ---------- ADF (Atlassian Document Format) -> DOM, text only, no innerHTML ----------
const BLOCKS = {
  paragraph: "p", bulletList: "ul", orderedList: "ol", listItem: "li", blockquote: "blockquote",
  table: "table", tableRow: "tr", tableHeader: "th", tableCell: "td", taskList: "ul", decisionList: "ul",
};
function safeUrl(u) { return /^(https?:|mailto:)/i.test(u || "") ? u : null; }
function adf(node) {
  if (!node) return document.createTextNode("");
  const kids = () => (node.content || []).map(adf);
  const a = node.attrs || {};
  switch (node.type) {
    case "doc": return el("div", { class: "adf" }, kids());
    case "text": {
      let out = document.createTextNode(node.text || "");
      for (const m of node.marks || []) {
        const tag = { strong: "b", em: "i", code: "code", strike: "s", underline: "u" }[m.type];
        if (tag) out = el(tag, {}, out);
        else if (m.type === "link" && safeUrl(m.attrs && m.attrs.href)) {
          out = el("a", { href: m.attrs.href, target: "_blank", rel: "noopener" }, out);
        }
      }
      return out;
    }
    case "heading": return el("h" + Math.min(Math.max(a.level || 3, 3), 6), {}, kids());
    case "codeBlock": return el("pre", {}, el("code", {}, kids()));
    case "hardBreak": return el("br");
    case "rule": return el("hr");
    case "panel": return el("div", { class: "panel" }, kids());
    case "expand": case "nestedExpand": return el("details", {}, el("summary", {}, a.title || "More"), kids());
    case "taskItem": case "decisionItem": return el("li", {}, a.state === "DONE" || a.state === "DECIDED" ? "☑ " : "☐ ", kids());
    case "mention": return el("span", { class: "mention" }, a.text || "@someone");
    case "emoji": return document.createTextNode(a.text || a.shortName || "");
    case "status": return el("code", {}, a.text || "");
    case "date": return document.createTextNode(new Date(Number(a.timestamp)).toLocaleDateString());
    case "inlineCard": case "blockCard": case "embedCard":
      return safeUrl(a.url) ? el("a", { href: a.url, target: "_blank", rel: "noopener" }, a.url) : document.createTextNode("");
    case "mediaSingle": case "mediaGroup": case "media": case "mediaInline":
      return el("span", { class: "att" }, "[attachment: open in Jira] ");
  }
  if (BLOCKS[node.type]) return el(BLOCKS[node.type], {}, kids());
  return el("span", {}, kids());  // unknown node: keep its text
}

function textToAdf(text) {
  return {
    type: "doc", version: 1,
    content: text.trim().split(/\n\s*\n/).map((para) => {
      const content = [];
      para.split("\n").forEach((line, i) => {
        if (i) content.push({ type: "hardBreak" });
        if (line) content.push({ type: "text", text: line });
      });
      return { type: "paragraph", content };
    }),
  };
}

// A description is safe to edit as plain text only if that loses nothing (no formatting, lists, code, media...).
function plainSafe(doc) {
  const ok = (n) => ["doc", "paragraph", "hardBreak"].includes(n.type) ? (n.content || []).every(ok)
    : n.type === "text" && !(n.marks || []).length;
  return !doc || ok(doc);
}
function adfToText(doc) {
  if (!doc) return "";
  return (doc.content || []).map((p) => (p.content || []).map((n) => n.type === "hardBreak" ? "\n" : n.text || "").join("")).join("\n\n");
}

// ---------- sidebar & header ----------
const NAV_ICONS = {
  mine: '<circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2.25" fill="currentColor"/>',
  all: '<rect x="2" y="2" width="9" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 14h6a2.5 2.5 0 0 0 2.5-2.5v-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
};

function whoLabel() {
  if (state.who === "mine") return "My issues";
  if (state.who === "all") return "All issues";
  const p = people.find((u) => u.accountId === state.who);
  return p ? p.displayName : "Issues";
}

function renderSide() {
  const nav = (value, label, ico) => el("button", { class: "nav" + (state.who === value ? " on" : ""), onclick: () => setWho(value) }, ico, el("span", {}, label));
  const k = (...keys) => keys.map((x) => [el("kbd", {}, x), " "]);
  $("#side").replaceChildren(...[
    el("div", { class: "ws" }, el("span", { class: "logo" }, cfg.project.slice(0, 2)), el("span", {}, "Jira · " + cfg.project)),
    nav("mine", "My issues", icon(16, NAV_ICONS.mine, "")),
    nav("all", "All issues", icon(16, NAV_ICONS.all, "")),
    people.length ? el("div", { class: "side-h" }, "People") : null,
    ...people.map((u) => nav(u.accountId, u.displayName, avatar(u))),
    el("div", { class: "hints" },
      el("div", {}, k("c"), "new  ", k("⌘K"), "search  ", k("/"), "filter"),
      el("div", {}, k("j", "k"), "move  ", k("↵"), "open  ", k("esc"), "close"),
      el("div", {}, k("s", "p", "a"), "status/priority/assignee"),
      el("div", {}, k("m"), "comment  ", k("⌘B"), "board  ", k("r"), "refresh")),
  ].filter(Boolean));
}

function setWho(value) {
  state.who = value;
  store("who", value);
  renderSide();
  $("#title").textContent = whoLabel();
  issues = [];
  $("#count").textContent = "";
  $("#list").replaceChildren(el("p", { class: "empty" }, "Loading…"));
  loadList();
}

function setView(view) {
  state.view = view;
  store("view", view);
  $("#vList").setAttribute("aria-pressed", String(view === "list"));
  $("#vBoard").setAttribute("aria-pressed", String(view === "board"));
  $("#list").hidden = view !== "list";
  $("#board").hidden = view !== "board";
  renderMain();
}

function toggleDone() {
  state.showDone = !state.showDone;
  store("showDone", state.showDone ? "1" : "0");
  $("#showDone").setAttribute("aria-pressed", String(state.showDone));
  return loadList().then(() => {
    // Done sorts last, usually off-screen: jump to it so the toggle visibly does something.
    if (!state.showDone) return;
    if (state.view === "board") {
      const col = document.querySelector('#board .col[data-kind="done"]');
      if (col) col.scrollIntoView({ behavior: "smooth", inline: "nearest", block: "nearest" });
      return;
    }
    const done = document.querySelector('#list section[data-kind="done"]');
    const list = $("#list");
    if (done) list.scrollBy({ top: done.getBoundingClientRect().top - list.getBoundingClientRect().top, behavior: "smooth" });
  });
}

// ---------- list ----------
function buildJql() {
  let jql = 'project = "' + cfg.project + '"';
  if (state.who === "mine") jql += " AND assignee = currentUser()";
  else if (state.who !== "all") jql += ' AND assignee = "' + state.who + '"';
  if (!state.showDone) jql += " AND statusCategory != Done";
  if (state.sprint === "open") jql += " AND sprint in openSprints()";
  else if (/^\d+$/.test(state.sprint)) jql += " AND sprint = " + state.sprint;
  return jql + " ORDER BY updated DESC";
}

async function loadList() {
  const seq = ++listSeq;
  try {
    const jql = buildJql();
    const out = [];
    let token;
    for (let page = 0; page < 5; page++) {  // cap at 500 issues
      const body = { jql, fields: FIELDS, maxResults: 100 };
      if (token) body.nextPageToken = token;
      const r = await api("search/jql", body);
      out.push(...(r.issues || []));
      token = r.nextPageToken;
      if (!token || r.isLast) break;
    }
    if (seq !== listSeq) return;  // a newer load started meanwhile
    issues = out;
    renderMain();
    lastRefresh = Date.now();
    $("#updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (e) {
    if (seq === listSeq) toast("Couldn't load tickets: " + e.message, true);
  }
}

function matches(i, q) {
  const f = i.fields;
  return i.key.toLowerCase().includes(q) || (f.summary || "").toLowerCase().includes(q) ||
    (f.assignee && f.assignee.displayName.toLowerCase().includes(q));
}

function shown() {
  const q = state.filter.trim().toLowerCase();
  return q ? issues.filter((i) => matches(i, q)) : issues;
}

function renderMain() {
  const list = shown();
  $("#count").textContent = state.filter.trim() ? list.length + " / " + issues.length : issues.length ? String(issues.length) : "";
  if (state.view === "board") renderBoard(list);
  else renderList(list);
  if (cursor && !visible.includes(cursor)) cursor = null;
}

function groupByStatus(list) {
  const groups = new Map();
  for (const i of list) {
    const s = i.fields.status;
    if (!groups.has(s.id)) groups.set(s.id, { status: s, items: [] });
    groups.get(s.id).items.push(i);
  }
  return [...groups.values()].sort((a, b) => statusRank(a.status) - statusRank(b.status) || a.status.name.localeCompare(b.status.name));
}

function renderList(list) {
  visible = [];
  const sections = groupByStatus(list).map((g) => {
    const name = g.status.name;
    const closed = state.collapsed.has(name);
    if (!closed) visible.push(...g.items.map((i) => i.key));
    return el("section", { "data-kind": statusKind(g.status) },
      el("div", { class: "gh" + (closed ? " closed" : ""), onclick: () => toggleGroup(name) },
        icon(16, ICONS.chev, "chev"), statusIcon(g.status), el("span", {}, name), el("span", { class: "gcount" }, g.items.length)),
      closed ? null : g.items.map(row));
  });
  const empty = state.filter.trim() ? "No tickets match “" + state.filter.trim() + "”." : "No tickets here.";
  $("#list").replaceChildren(...(sections.length ? sections : [el("p", { class: "empty" }, empty)]));
}

function row(i) {
  const f = i.fields;
  const btn = (title, child, onPick) => {
    const b = el("button", { class: "ibtn", title }, child);
    b.addEventListener("click", (e) => { e.stopPropagation(); onPick(b); });
    return b;
  };
  return el("div", {
    class: "row" + (i.key === current ? " open" : "") + (i.key === cursor ? " cur" : ""),
    "data-key": i.key, onclick: () => openIssue(i.key), onmouseenter: () => setCursor(i.key),
  },
    btn((f.priority ? f.priority.name : "No priority") + " · change (p)", prioIcon(f.priority), (b) => priorityMenu(i.key, b)),
    el("span", { class: "rid" }, i.key),
    btn(f.status.name + " · change status (s)", statusIcon(f.status), (b) => statusMenu(i.key, b)),
    el("span", { class: "rtitle", title: f.parent ? "Parent: " + f.parent.key + " " + (f.parent.fields || {}).summary : null }, f.summary),
    el("span", { class: "rright" },
      subBadge(f),
      btn((f.assignee ? f.assignee.displayName : "Unassigned") + " · change (a)", avatar(f.assignee), (b) => assigneeMenu(i.key, b)),
      el("span", { class: "rdate", title: "Updated " + new Date(f.updated).toLocaleString() }, shortDate(f.updated))));
}

function toggleGroup(name) {
  if (state.collapsed.has(name)) state.collapsed.delete(name);
  else state.collapsed.add(name);
  store("collapsed", JSON.stringify([...state.collapsed]));
  renderMain();
}

// ---------- board ----------
function renderBoard(list) {
  const byStatus = new Map();
  for (const i of list) {
    const id = String(i.fields.status.id);
    if (!byStatus.has(id)) byStatus.set(id, []);
    byStatus.get(id).push(i);
  }
  const cols = boardCols.map((c) => ({ name: c.name, ids: c.ids, items: c.ids.flatMap((id) => byStatus.get(id) || []) }));
  // Statuses the Jira board doesn't map to a column (e.g. Done on this board) get their own column.
  for (const g of groupByStatus(list)) {
    if (!boardCols.some((c) => c.ids.includes(String(g.status.id)))) cols.push({ name: g.status.name, ids: [String(g.status.id)], items: g.items });
  }
  visible = cols.flatMap((c) => c.items.map((i) => i.key));
  const els = cols.map((c) => {
    const st = (c.items[0] && c.items[0].fields.status) || statusById.get(c.ids[0]) || { name: c.name };
    const cards = el("div", { class: "cards" }, c.items.map(card));
    const col = el("div", { class: "col", "data-kind": statusKind(st) },
      el("div", { class: "colh" }, statusIcon(st), el("span", {}, c.name), el("span", { class: "gcount" }, c.items.length)), cards);
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("drop"); });
    col.addEventListener("dragleave", (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove("drop"); });
    col.addEventListener("drop", (e) => {
      e.preventDefault();
      col.classList.remove("drop");
      const key = e.dataTransfer.getData("text/plain");
      if (key) moveToColumn(key, c);
    });
    return col;
  });
  if (!state.showDone) {
    els.push(el("div", { class: "col ghost" }, el("span", {}, "Done is hidden"), el("button", { class: "btn", onclick: toggleDone }, "Show done")));
  }
  $("#board").replaceChildren(...els);
}

function card(i) {
  const f = i.fields;
  const c = el("div", {
    class: "tcard" + (i.key === current ? " open" : "") + (i.key === cursor ? " cur" : ""), draggable: "true",
    "data-key": i.key, onclick: () => openIssue(i.key), onmouseenter: () => setCursor(i.key),
  },
    el("div", { class: "top" }, el("span", {}, i.key), el("span", { class: "spacer" }), prioIcon(f.priority)),
    el("div", { class: "t" }, f.summary),
    el("div", { class: "bot" }, subBadge(f), el("span", { class: "spacer" }), avatar(f.assignee)));
  c.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", i.key); e.dataTransfer.effectAllowed = "move"; c.classList.add("dragging"); });
  c.addEventListener("dragend", () => c.classList.remove("dragging"));
  return c;
}

async function moveToColumn(key, col) {
  const i = issueByKey(key);
  if (!i || col.ids.includes(String(i.fields.status.id))) return;
  let trans;
  try {
    trans = (await api("issue/" + enc(key) + "/transitions")).transitions || [];
  } catch (e) {
    return toast("Couldn't load statuses for " + key + ": " + e.message, true);
  }
  const t = trans.find((x) => col.ids.includes(String(x.to.id)));
  if (!t) return toast(key + " can't move from " + i.fields.status.name + " to " + col.name + " directly in this workflow.", true);
  transition(key, { id: t.id, label: t.to.name });
}

// ---------- cursor & keyboard movement ----------
function markRows() {
  for (const r of document.querySelectorAll(".row[data-key], .tcard[data-key]")) {
    r.classList.toggle("cur", r.dataset.key === cursor);
    r.classList.toggle("open", r.dataset.key === current);
  }
}

function setCursor(key, scroll) {
  cursor = key;
  markRows();
  if (scroll) {
    const r = rowFor(key);
    if (r) r.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
}

function move(step) {
  if (!visible.length) return;
  const at = visible.indexOf(cursor || current);
  const next = visible[Math.max(0, Math.min(visible.length - 1, at < 0 ? 0 : at + step))];
  setCursor(next, true);
  if (current) openIssue(next);  // peek follows the cursor, like Linear
}

// ---------- popover menu ----------
function openMenu(anchor, title, items, onPick, opts) {
  opts = opts || {};
  closeMenu();
  const box = el("div", { class: "menu", role: "menu" }, el("div", { class: "mh" }, title));
  const search = opts.search ? el("input", { class: "msearch", placeholder: "Filter…", autocomplete: "off" }) : null;
  const list = el("div", { class: "mlist" });
  if (search) box.append(search);
  box.append(list);
  menu = { box, search, buttons: [], idx: 0 };
  const fill = () => {
    const q = search ? search.value.trim().toLowerCase() : "";
    const hits = items.filter((it) => !q || it.label.toLowerCase().includes(q));
    menu.buttons = hits.map((it, n) => {
      const b = el("button", { class: "mi", role: "menuitem" }, it.icon || null, el("span", { class: "grow" }, it.label),
        it.via ? el("span", { class: "via" }, it.via) : null,
        it.current ? icon(14, ICONS.check, "") : !search && n < 9 ? el("kbd", {}, String(n + 1)) : null);
      b.addEventListener("mousemove", () => hilite(n));
      b.addEventListener("click", () => { closeMenu(); onPick(it); });
      return b;
    });
    list.replaceChildren(...(menu.buttons.length ? menu.buttons : [el("div", { class: "mh" }, opts.empty || "No matches")]));
    hilite(Math.max(0, hits.findIndex((it) => it.current && !q)));
  };
  if (search) search.addEventListener("input", fill);
  fill();
  document.body.append(box);
  const r = anchor.getBoundingClientRect();
  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
  box.style.top = (r.bottom + 4 + h > innerHeight - 8 ? Math.max(8, r.top - h - 4) : r.bottom + 4) + "px";
  if (search) search.focus();
}
function hilite(n) {
  if (!menu || !menu.buttons.length) return;
  menu.idx = (n + menu.buttons.length) % menu.buttons.length;
  menu.buttons.forEach((b, i) => b.classList.toggle("hi", i === menu.idx));
  menu.buttons[menu.idx].scrollIntoView({ block: "nearest" });
}
function closeMenu() { if (menu) { menu.box.remove(); menu = null; } }

// ---------- edits: status, priority, assignee, title, description ----------
async function statusMenu(key, anchor) {
  const i = issueByKey(key);
  if (busy || !i) return;
  let trans;
  try {
    trans = (await api("issue/" + enc(key) + "/transitions")).transitions || [];
  } catch (e) {
    return toast("Couldn't load statuses for " + key + ": " + e.message, true);
  }
  if (!anchor.isConnected) return;  // re-rendered meanwhile
  const items = trans.filter((t) => t.to.id !== i.fields.status.id).map((t) => ({
    id: t.id, label: t.to.name, via: t.name !== t.to.name ? t.name : "", icon: statusIcon(t.to),
  }));
  openMenu(anchor, key + " · move to", items, (it) => transition(key, it), { empty: "No transitions available" });
}

async function transition(key, it) {
  busy = true;
  toast("Moving " + key + " to " + it.label + "…");
  try {
    await api("issue/" + enc(key) + "/transitions", { transition: { id: it.id } });
    toast(key + " → " + it.label);
    busy = false;
    await afterEdit(key);
  } catch (e) {
    toast("Status change failed: " + e.message + " (if it needs extra fields, use Open in Jira)", true);
  } finally {
    busy = false;
  }
}

function priorityMenu(key, anchor) {
  const i = issueByKey(key);
  if (busy || !i || !priorities.length) return;
  const cur = i.fields.priority ? i.fields.priority.id : null;
  const items = priorities.map((p) => ({ id: p.id, label: p.name, icon: prioIcon(p), current: p.id === cur }));
  openMenu(anchor, key + " · priority", items, (it) => {
    if (!it.current) updateIssue(key, { priority: { id: it.id } }, key + " priority → " + it.label);
  });
}

function assigneeMenu(key, anchor) {
  const i = issueByKey(key);
  if (busy || !i) return;
  const cur = i.fields.assignee ? i.fields.assignee.accountId : null;
  const mine = me ? [me] : [];
  const others = people.filter((u) => !me || u.accountId !== me.accountId);
  const items = [{ id: null, label: "Unassigned", icon: avatar(null), current: !cur },
    ...[...mine, ...others].map((u) => ({ id: u.accountId, label: u.displayName + (me && u.accountId === me.accountId ? " (me)" : ""), icon: avatar(u), current: u.accountId === cur }))];
  openMenu(anchor, key + " · assignee", items, async (it) => {
    if (it.current) return;
    busy = true;
    try {
      await api("issue/" + enc(key) + "/assignee", { accountId: it.id }, "PUT");
      toast(key + " → " + (it.id ? it.label : "Unassigned"));
      busy = false;
      await afterEdit(key);
    } catch (e) {
      toast("Assign failed: " + e.message, true);
    } finally {
      busy = false;
    }
  }, { search: true });
}

async function updateIssue(key, fields, msg) {
  busy = true;
  try {
    await api("issue/" + enc(key), { fields }, "PUT");
    toast(msg);
    busy = false;
    await afterEdit(key);
  } catch (e) {
    toast("Update failed: " + e.message, true);
    if (current === key) loadDetail();
  } finally {
    busy = false;
  }
}

function afterEdit(key) {
  return Promise.all([loadList(), current ? loadDetail() : null]);
}

function editTitle(h1, key, old) {
  const ta = el("textarea", { class: "dtitle", rows: "1" });
  ta.value = old;
  const fit = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
  ta.addEventListener("input", fit);
  h1.replaceWith(ta);
  fit();
  ta.focus();
  ta.setSelectionRange(old.length, old.length);
  let done = false;
  const finish = (save) => {
    if (done) return;
    done = true;
    const v = ta.value.replace(/\s+/g, " ").trim();
    if (save && v && v !== old) {
      h1.textContent = v;
      ta.replaceWith(h1);
      updateIssue(key, { summary: v }, key + " title updated");
    } else ta.replaceWith(h1);
  };
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); }
  });
  ta.addEventListener("blur", () => finish(true));
}

function editDescription(holder, key, doc) {
  const ta = el("textarea", { class: "", placeholder: "Add a description…" });
  ta.value = adfToText(doc);
  const save = el("button", { class: "btn primary" }, "Save");
  const cancel = el("button", { class: "btn" }, "Cancel");
  const box = el("div", { class: "composer" }, ta, el("div", { class: "crow" }, el("span", { class: "cmsg" }, "⌘↵ to save"), cancel, save));
  const view = holder.firstChild;
  holder.replaceChildren(box);
  ta.style.minHeight = "140px";
  ta.focus();
  const restore = () => holder.replaceChildren(view);
  const commit = () => {
    const text = ta.value.trim();
    save.disabled = true;
    updateIssue(key, { description: text ? textToAdf(text) : null }, key + " description updated");
  };
  cancel.addEventListener("click", restore);
  save.addEventListener("click", commit);
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) commit();
    else if (e.key === "Escape") { e.stopPropagation(); restore(); }
  });
}

// ---------- detail ----------
function openIssue(key) {
  current = cursor = key;
  history.replaceState(null, "", "#" + key);
  markRows();
  const d = $("#detail");
  d.hidden = false;
  if (!d.querySelector('.dh[data-key="' + CSS.escape(key) + '"]')) {
    d.replaceChildren(el("div", { class: "dh" }, el("span", { class: "crumb" }, key)), el("div", { class: "dscroll" }, el("p", { class: "nodesc" }, "Loading…")));
  }
  loadDetail();
}

function closeDetail() {
  current = null;
  history.replaceState(null, "", location.pathname + location.search);
  $("#detail").hidden = true;
  markRows();
}

async function loadDetail() {
  const key = current;
  if (!key) return;
  const seq = ++detailSeq;
  try {
    const [issue, comments, children] = await Promise.all([
      api("issue/" + enc(key) + "?fields=summary,status,description,assignee,reporter,priority,issuetype,created,parent,subtasks"),
      api("issue/" + enc(key) + "/comment?orderBy=-created&maxResults=100"),
      api("search/jql", { jql: 'parent = "' + key + '" ORDER BY created ASC', fields: FIELDS, maxResults: 100 }).catch(() => ({ issues: [] })),
    ]);
    if (seq !== detailSeq || key !== current) return;
    known.set(issue.key, issue);
    for (const c of children.issues || []) known.set(c.key, c);
    renderDetail(issue, (comments.comments || []).reverse(), children.issues || []);  // newest 100, shown oldest-first
  } catch (e) {
    if (seq === detailSeq && key === current) {
      $("#detail").replaceChildren(el("div", { class: "dh", "data-key": key }, el("span", { class: "crumb" }, key), el("span", { class: "spacer" }),
        el("button", { class: "btn icon", title: "Close (esc)", onclick: closeDetail }, icon(14, ICONS.close, ""))),
        el("div", { class: "dscroll" }, el("p", { style: "color:var(--err)" }, e.message)));
    }
  }
}

function renderDetail(issue, comments, children) {
  const f = issue.fields;
  const d = $("#detail");
  // Keep an unsent comment draft and the scroll position across auto-refreshes.
  const oldBox = $("#cbox");
  const draft = oldBox && oldBox.dataset.key === issue.key ? oldBox.value : "";
  const scroll = d.querySelector(".dscroll[data-key='" + CSS.escape(issue.key) + "']");
  const scrollTop = scroll ? scroll.scrollTop : 0;

  const chip = (id, title, kids, onclick) => {
    const b = el("button", { class: "chip", id, title }, kids);
    b.addEventListener("click", () => onclick(b));
    return b;
  };
  const h1 = el("h1", { class: "dtitle", title: "Click to edit" }, f.summary);
  h1.addEventListener("click", () => editTitle(h1, issue.key, f.summary));

  const box = el("textarea", { id: "cbox", placeholder: "Leave a comment…" });
  box.dataset.key = issue.key;
  box.value = draft;
  const send = el("button", { class: "btn primary" }, "Comment");
  const cmsg = el("span", { class: "cmsg" }, "⌘↵ to send");
  const submit = () => postComment(issue.key, box, send, cmsg);
  send.addEventListener("click", submit);
  box.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submit(); });

  const descHolder = el("div", {}, f.description ? adf(f.description) : el("p", { class: "nodesc" }, "No description."));
  const canEditDesc = plainSafe(f.description);
  const descEdit = canEditDesc
    ? el("button", { class: "link", onclick: () => editDescription(descHolder, issue.key, f.description) }, f.description ? "Edit" : "Add")
    : el("a", { class: "link", href: cfg.site + "/browse/" + issue.key, target: "_blank", rel: "noopener", title: "Has formatting that plain-text editing would lose" }, "Edit in Jira ↗");

  const isSub = f.issuetype && f.issuetype.subtask;
  const done = children.filter((c) => ((c.fields.status || {}).statusCategory || {}).key === "done").length;
  const subRows = children.map((c) => {
    const sb = el("button", { class: "ibtn", title: c.fields.status.name + " · change status" }, statusIcon(c.fields.status));
    sb.addEventListener("click", (e) => { e.stopPropagation(); statusMenu(c.key, sb); });
    return el("div", { class: "subrow", onclick: () => openIssue(c.key) },
      sb, el("span", { class: "rid" }, c.key), el("span", { class: "rtitle" }, c.fields.summary), avatar(c.fields.assignee));
  });

  const body = el("div", { class: "dscroll", "data-key": issue.key },
    f.parent ? el("button", { class: "parent", title: "Open parent", onclick: () => openIssue(f.parent.key) },
      icon(14, ICONS.up, ""), el("span", {}, f.parent.key + " · " + ((f.parent.fields || {}).summary || ""))) : null,
    h1,
    el("div", { class: "props" },
      chip("schip", "Change status (s)", [statusIcon(f.status), f.status.name], (b) => statusMenu(issue.key, b)),
      chip("pchip", "Change priority (p)", [prioIcon(f.priority), f.priority ? f.priority.name : "No priority"], (b) => priorityMenu(issue.key, b)),
      chip("achip", "Change assignee (a)", [avatar(f.assignee), f.assignee ? f.assignee.displayName : "Unassigned"], (b) => assigneeMenu(issue.key, b)),
      f.issuetype ? el("span", { class: "chip" }, f.issuetype.name) : null),
    el("div", { class: "meta" }, "Created " + shortDate(f.created) + (f.reporter ? " by " + f.reporter.displayName : "")),
    el("div", { class: "sec" }, "Description", el("span", { class: "spacer" }), descEdit),
    descHolder,
    isSub ? null : el("div", { class: "sec" }, "Sub-issues" + (children.length ? " · " + done + "/" + children.length + " done" : ""),
      el("span", { class: "spacer" }),
      el("button", { class: "link", onclick: () => openCreate(issue) }, "+ Add sub-issue")),
    isSub || !children.length ? null : el("div", { class: "subs" }, subRows),
    el("div", { class: "sec" }, "Activity" + (comments.length ? " · " + comments.length : "")),
    ...comments.map((c) => el("div", { class: "card" },
      el("div", { class: "who" }, avatar(c.author), el("span", { class: "name" }, c.author ? c.author.displayName : "?"),
        el("span", { class: "when", title: new Date(c.created).toLocaleString() }, ago(c.created))),
      adf(c.body))),
    el("div", { class: "composer" }, box, el("div", { class: "crow" }, cmsg, send)));

  d.replaceChildren(
    el("div", { class: "dh", "data-key": issue.key },
      el("span", { class: "crumb" }, cfg.project), "›", el("span", { class: "crumb", style: "color:var(--title)" }, issue.key),
      el("span", { class: "spacer" }),
      el("a", { class: "btn", href: cfg.site + "/browse/" + issue.key, target: "_blank", rel: "noopener" }, "Open in Jira ↗"),
      el("button", { class: "btn icon", title: "Close (esc)", onclick: closeDetail }, icon(14, ICONS.close, ""))),
    body);
  body.scrollTop = scrollTop;
}

async function postComment(key, box, btn, msg) {
  if (!box.value.trim() || btn.disabled) return;
  busy = true;
  btn.disabled = true;
  msg.textContent = "Sending…";
  try {
    await api("issue/" + enc(key) + "/comment", { body: textToAdf(box.value) });
    box.value = "";
    busy = false;
    await loadDetail();
    const s = $("#detail .dscroll");
    if (s) s.scrollTop = s.scrollHeight;
  } catch (e) {
    msg.textContent = "";
    toast("Comment failed: " + e.message, true);
    btn.disabled = false;
  } finally {
    busy = false;
  }
}

// ---------- create issue ----------
const metaCache = new Map();
const HANDLED = new Set(["summary", "issuetype", "project", "reporter", "parent", "description", "priority", "assignee"]);
let createDraft = { title: "", desc: "" };

function typeFields(typeId) {
  if (!metaCache.has(typeId)) {
    const p = api("issue/createmeta/" + enc(cfg.project) + "/issuetypes/" + typeId + "?maxResults=200").then((r) => r.fields || r.results || []);
    p.catch(() => metaCache.delete(typeId));
    metaCache.set(typeId, p);
  }
  return metaCache.get(typeId);
}

function closeModal() {
  if (!modal) return;
  if (modal.onClose) modal.onClose();
  modal.ov.remove();
  modal = null;
}

function showModal(content, onClose) {
  closeMenu();
  closeModal();
  const ov = el("div", { class: "overlay" }, content);
  ov.addEventListener("mousedown", (e) => { if (e.target === ov) closeModal(); });
  document.body.append(ov);
  modal = { ov, onClose };
  return ov;
}

async function openCreate(parent) {
  if (busy) return;
  if (!issueTypes.length) {
    try { issueTypes = (await api("issue/createmeta/" + enc(cfg.project) + "/issuetypes")).issueTypes || []; }
    catch (e) { return toast("Couldn't load issue types: " + e.message, true); }
  }
  const parentIsEpic = parent && parent.fields.issuetype && parent.fields.issuetype.hierarchyLevel === 1;
  const types = issueTypes.filter((t) => parent ? (parentIsEpic ? !t.subtask && t.hierarchyLevel === 0 : t.subtask) : !t.subtask);
  if (!types.length) return toast("This project has no issue type for that.", true);
  const lastType = recall("lastType");
  const defType = (types.find((t) => t.id === lastType) || types.find((t) => t.name === "Task") || types[0]).id;

  const title = el("input", { class: "ntitle", placeholder: parent ? "Sub-issue title" : "Issue title", autocomplete: "off" });
  const desc = el("textarea", { class: "ndesc", placeholder: "Add description…" });
  if (!parent) { title.value = createDraft.title; desc.value = createDraft.desc; }

  const select = (cls, options, value, lead) => {
    const s = el("select", {}, options.map(([v, label]) => el("option", { value: v }, label)));
    s.value = value;
    return { chip: el("label", { class: "chip" + (cls ? " " + cls : "") }, lead || null, s), s };
  };
  const type = select("", types.map((t) => [t.id, t.name]), defType);
  const defPrio = (priorities.find((p) => p.name === "Medium") || priorities[0] || {}).id || "";
  const prio = select("", [["", "No priority"], ...priorities.map((p) => [p.id, p.name])], defPrio, prioIcon(priorities.find((p) => p.id === defPrio)));
  prio.s.addEventListener("change", () => prio.chip.firstChild.replaceWith(prioIcon(priorities.find((p) => p.id === prio.s.value))));
  const ppl = [...(me ? [me] : []), ...people.filter((u) => !me || u.accountId !== me.accountId)];
  const who = select("", [["", "Unassigned"], ...ppl.map((u) => [u.accountId, u.displayName + (me && u.accountId === me.accountId ? " (me)" : "")])],
    me ? me.accountId : "");
  const extras = el("span", { style: "display:contents" });
  const warn = el("div", { class: "warn" });
  let dynamic = [];  // [{field, s, chip}]
  let fieldIds = new Set();

  // Required fields Jira insists on (e.g. Client, Fix versions) get a select; sub-issues inherit the parent's value.
  async function loadTypeFields() {
    extras.replaceChildren();
    warn.textContent = "";
    dynamic = [];
    let fields;
    try { fields = await typeFields(type.s.value); } catch (e) { warn.textContent = "Couldn't load fields: " + e.message; return; }
    fieldIds = new Set(fields.map((x) => x.fieldId));
    const need = fields.filter((x) => x.required && !x.hasDefaultValue && !HANDLED.has(x.fieldId));
    let inherited = {};
    if (parent && need.length) {
      try { inherited = (await api("issue/" + enc(parent.key) + "?fields=" + need.map((x) => x.fieldId).join(","))).fields || {}; } catch (e) {}
    }
    const unsupported = [];
    for (const fld of need) {
      const av = fld.allowedValues || [];
      if (!av.length) { unsupported.push(fld.name); continue; }
      const pv = inherited[fld.fieldId];
      const pid = Array.isArray(pv) ? (pv[0] || {}).id : (pv || {}).id;
      const val = av.some((v) => v.id === pid) ? pid : (av.some((v) => v.id === recall("last." + fld.fieldId)) ? recall("last." + fld.fieldId) : "");
      const sel = select("req", [["", fld.name + "…"], ...av.filter((v) => !v.archived).map((v) => [v.id, v.name || v.value])], val);
      sel.chip.title = fld.name + " (required by Jira)";
      dynamic.push({ field: fld, s: sel.s, chip: sel.chip });
      extras.append(sel.chip);
    }
    if (unsupported.length) warn.textContent = "Jira also requires " + unsupported.join(", ") + ", which can't be set here yet. Create it in Jira instead.";
  }
  type.s.addEventListener("change", loadTypeFields);

  const msg = el("span", { class: "cmsg" });
  const create = el("button", { class: "btn primary" }, parent ? "Create sub-issue" : "Create issue");
  const cancel = el("button", { class: "btn", onclick: closeModal }, "Cancel");

  async function submit() {
    if (create.disabled) return;
    const summary = title.value.trim();
    if (!summary) { title.focus(); msg.textContent = "Add a title first."; return; }
    const missing = dynamic.filter((d) => !d.s.value);
    dynamic.forEach((d) => d.chip.classList.toggle("bad", !d.s.value));
    if (missing.length) { msg.textContent = "Pick " + missing.map((d) => d.field.name).join(", ") + "."; return; }
    const fields = { project: { key: cfg.project }, issuetype: { id: type.s.value }, summary };
    if (desc.value.trim()) fields.description = textToAdf(desc.value);
    if (prio.s.value && fieldIds.has("priority")) fields.priority = { id: prio.s.value };
    if (who.s.value && fieldIds.has("assignee")) fields.assignee = { accountId: who.s.value };
    if (parent) fields.parent = { key: parent.key };
    for (const d of dynamic) fields[d.field.fieldId] = d.field.schema && d.field.schema.type === "array" ? [{ id: d.s.value }] : { id: d.s.value };
    create.disabled = true;
    msg.textContent = "Creating…";
    try {
      const r = await api("issue", { fields });
      store("lastType", type.s.value);
      for (const d of dynamic) store("last." + d.field.fieldId, d.s.value);
      if (!parent) createDraft = { title: "", desc: "" };
      title.value = "";
      closeModal();
      toast("Created " + r.key);
      await loadList();
      if (parent && current === parent.key) loadDetail();
      else openIssue(r.key);
    } catch (e) {
      msg.textContent = "";
      toast("Create failed: " + e.message, true);
      create.disabled = false;
    }
  }
  create.addEventListener("click", submit);

  const dialog = el("div", { class: "modal", role: "dialog", "aria-label": "New issue" },
    el("div", { class: "mhead" }, el("span", { class: "logo" }, cfg.project.slice(0, 2)),
      el("span", {}, parent ? cfg.project + " › " + parent.key + " › New sub-issue" : cfg.project + " › New issue"),
      el("span", { class: "spacer" }), el("button", { class: "btn icon", title: "Close (esc)", onclick: closeModal }, icon(14, ICONS.close, ""))),
    el("div", { class: "mbody" }, title, desc,
      el("div", { class: "props" }, type.chip, prio.chip, el("label", { class: "chip" }, avatar(null), who.s), extras), warn),
    el("div", { class: "mfoot" }, msg, cancel, create, el("kbd", { title: "Create" }, "⌘↵")));
  dialog.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
    else if (e.key === "Enter" && e.target === title) { e.preventDefault(); desc.focus(); }
  });
  // Keep an unsent new-issue draft if the dialog is closed by accident.
  showModal(dialog, () => { if (!parent && title.value) createDraft = { title: title.value, desc: desc.value }; });
  title.focus();
  loadTypeFields();
}

// ---------- command palette (⌘K) ----------
function searchJql(q) {
  const safe = q.replace(/["\\]/g, " ").trim();
  return 'project = "' + cfg.project + '" AND text ~ "' + safe + '*" ORDER BY updated DESC';
}

function openPalette() {
  if (modal) return;
  const input = el("input", { class: "pinput", placeholder: "Search issues or type a command…", autocomplete: "off", spellcheck: "false" });
  const list = el("div", { class: "plist" });
  showModal(el("div", { class: "palette", role: "dialog", "aria-label": "Command menu" }, input, list));
  const pal = { items: [], idx: 0, seq: 0, timer: 0 };
  modal.pal = pal;

  const commands = () => [
    { label: "New issue", hint: "C", icon: icon(14, ICONS.plus, ""), run: () => openCreate(null) },
    { label: state.view === "board" ? "Switch to list view" : "Switch to board view", hint: "⌘B", run: () => setView(state.view === "board" ? "list" : "board") },
    { label: "My issues", icon: icon(16, NAV_ICONS.mine, ""), run: () => setWho("mine") },
    { label: "All issues", icon: icon(16, NAV_ICONS.all, ""), run: () => setWho("all") },
    { label: state.showDone ? "Hide done tickets" : "Show done tickets", run: toggleDone },
    { label: "Refresh", hint: "R", run: refresh },
    ...people.map((u) => ({ label: u.displayName + "’s issues", icon: avatar(u), person: true, run: () => setWho(u.accountId) })),
  ];
  const issueItem = (i) => ({ label: i.fields.summary, via: i.key, icon: statusIcon(i.fields.status), run: () => { known.set(i.key, i); openIssue(i.key); } });

  const draw = (issueHits, cmds, note) => {
    pal.items = [...issueHits.map(issueItem), ...cmds];
    const btns = pal.items.map((it, n) => {
      const b = el("button", { class: "mi" }, it.icon || el("span", { style: "width:14px" }), el("span", { class: "grow" }, it.label),
        it.via ? el("span", { class: "via" }, it.via) : null, it.hint ? el("kbd", {}, it.hint) : null);
      b.addEventListener("mousemove", () => pick(n));
      b.addEventListener("click", () => run(n));
      return b;
    });
    pal.buttons = btns;
    list.replaceChildren(...btns, ...(note ? [el("div", { class: "mh" }, note)] : []), ...(!btns.length && !note ? [el("div", { class: "mh" }, "No results")] : []));
    pick(0);
  };
  const pick = (n) => {
    if (!pal.buttons.length) return;
    pal.idx = (n + pal.buttons.length) % pal.buttons.length;
    pal.buttons.forEach((b, i) => b.classList.toggle("hi", i === pal.idx));
    pal.buttons[pal.idx].scrollIntoView({ block: "nearest" });
  };
  const run = (n) => { const it = pal.items[n]; if (it) { closeModal(); it.run(); } };

  const query = () => {
    const q = input.value.trim();
    const ql = q.toLowerCase();
    const cmds = commands().filter((c) => ql ? c.label.toLowerCase().includes(ql) : !c.person);
    const local = ql ? issues.filter((i) => matches(i, ql)).slice(0, 6) : [];
    draw(local, cmds, q ? "Searching Jira…" : "");
    clearTimeout(pal.timer);
    if (!q) return;
    const seq = ++pal.seq;
    pal.timer = setTimeout(async () => {
      let hits = [];
      try {
        const m = q.match(/^(?:([A-Za-z][A-Za-z0-9]*)-)?(\d+)$/);
        if (m) {
          const key = (m[1] ? m[1].toUpperCase() : cfg.project) + "-" + m[2];
          hits = [await api("issue/" + enc(key) + "?fields=" + FIELDS.join(","))].filter(Boolean);
        } else {
          hits = (await api("search/jql", { jql: searchJql(q), fields: FIELDS, maxResults: 12 })).issues || [];
        }
      } catch (e) { /* no match: e.g. the key doesn't exist */ }
      if (!modal || modal.pal !== pal || seq !== pal.seq) return;
      const seen = new Set(local.map((i) => i.key));
      draw([...local, ...hits.filter((i) => !seen.has(i.key))].slice(0, 15), cmds, "");
    }, 200);
  };
  input.addEventListener("input", query);
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") pick(pal.idx + 1);
    else if (e.key === "ArrowUp") pick(pal.idx - 1);
    else if (e.key === "Enter") run(pal.idx);
    else return;
    e.preventDefault();
  });
  query();
  input.focus();
}

// ---------- keyboard ----------
document.addEventListener("keydown", (e) => {
  const k = e.key;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && k.toLowerCase() === "k") { e.preventDefault(); if (modal && modal.pal) closeModal(); else openPalette(); return; }
  if (mod && k.toLowerCase() === "b" && !modal) { e.preventDefault(); setView(state.view === "board" ? "list" : "board"); return; }
  if (menu) {
    const typing = menu.search && e.target === menu.search;
    if (k === "ArrowDown" || (!typing && k === "j")) hilite(menu.idx + 1);
    else if (k === "ArrowUp" || (!typing && k === "k")) hilite(menu.idx - 1);
    else if (k === "Enter") { if (menu.buttons[menu.idx]) menu.buttons[menu.idx].click(); }
    else if (k === "Escape") closeMenu();
    else if (!typing && /^[1-9]$/.test(k) && menu.buttons[k - 1]) menu.buttons[k - 1].click();
    else return;
    e.preventDefault();
    return;
  }
  if (modal) {
    if (k === "Escape") { e.preventDefault(); closeModal(); }
    return;
  }
  if (typingIn(e.target)) {
    if (k === "Escape") {
      if (e.target.id === "q" && e.target.value) { e.target.value = ""; state.filter = ""; renderMain(); }
      else e.target.blur();
    } else if (k === "Enter" && e.target.id === "q") {
      e.target.blur();
      if (visible.length) setCursor(visible[0], true);
    }
    return;
  }
  if (mod || e.altKey) return;
  const target = current || cursor;
  const anchor = (id, sel) => (current && $(id)) || (rowFor(target) && (rowFor(target).querySelector(sel) || rowFor(target)));
  switch (k) {
    case "j": case "ArrowDown": move(1); break;
    case "k": case "ArrowUp": move(-1); break;
    case "Enter": case "o": if (cursor) openIssue(cursor); break;
    case "Escape":
      if (current) closeDetail();
      else if (state.filter) { $("#q").value = ""; state.filter = ""; renderMain(); }
      break;
    case "c": openCreate(null); break;
    case "/": $("#q").focus(); $("#q").select(); break;
    case "s": if (target && anchor("#schip", ".ibtn:nth-of-type(2)")) statusMenu(target, anchor("#schip", ".ibtn:nth-of-type(2)")); break;
    case "p": if (target && anchor("#pchip", ".ibtn")) priorityMenu(target, anchor("#pchip", ".ibtn")); break;
    case "a": if (target && anchor("#achip", ".rright .ibtn")) assigneeMenu(target, anchor("#achip", ".rright .ibtn")); break;
    case "m": if (current && $("#cbox")) $("#cbox").focus(); break;
    case "r": refresh(); break;
    default: return;
  }
  e.preventDefault();
});

document.addEventListener("mousedown", (e) => { if (menu && !menu.box.contains(e.target)) closeMenu(); });

// ---------- startup ----------
function refresh() {
  if (busy || menu) return;
  loadList();
  // Don't re-render the panel under someone typing in it.
  const a = document.activeElement;
  if (current && !(typingIn(a) && a.closest("#detail"))) loadDetail();
}

async function loadPeople() {
  try {
    const users = await api("user/assignable/search?project=" + enc(cfg.project) + "&maxResults=1000");
    people = users.filter((u) => u.accountType === "atlassian").sort((a, b) => a.displayName.localeCompare(b.displayName));
    renderSide();
    $("#title").textContent = whoLabel();
  } catch (e) {
    toast("Couldn't load people: " + e.message, true);
  }
}

// Board columns order the list's groups, so load them before the first render when possible.
async function loadBoard() {
  if (!cfg.board) return;
  const [conf, sts, spr] = await Promise.all([
    api("/agile/board/" + enc(cfg.board) + "/configuration").catch(() => null),
    api("project/" + enc(cfg.project) + "/statuses").catch(() => []),
    api("/agile/board/" + enc(cfg.board) + "/sprint?state=active,future&maxResults=50").catch(() => null),  // kanban boards have none
  ]);
  for (const t of sts || []) for (const s of t.statuses || []) statusById.set(String(s.id), s);
  if (conf && conf.columnConfig) {
    boardCols = conf.columnConfig.columns.map((c) => ({ name: c.name, ids: (c.statuses || []).map((s) => String(s.id)) })).filter((c) => c.ids.length);
  }
  sprints = (spr && spr.values) || [];
  if (sprints.length) {
    const sel = $("#sprint");
    sel.replaceChildren(el("option", { value: "" }, "Any sprint"), el("option", { value: "open" }, "Open sprints"),
      ...sprints.map((s) => el("option", { value: String(s.id) }, s.name + (s.state === "active" ? " (active)" : ""))));
    sel.value = sprints.some((s) => String(s.id) === state.sprint) || state.sprint === "open" ? state.sprint : "";
    sel.hidden = false;
    sel.addEventListener("change", () => { state.sprint = sel.value; store("sprint", sel.value); loadList(); });
  } else state.sprint = "";
}

(async function init() {
  try { cfg = await (await fetch("/config")).json(); } catch (e) {}
  document.title = "jira-lite · " + cfg.project;
  state.who = recall("who") || "mine";
  state.showDone = recall("showDone") === "1";
  state.sprint = recall("sprint") || "";
  try { state.collapsed = new Set(JSON.parse(recall("collapsed") || "[]")); } catch (e) {}
  $("#showDone").setAttribute("aria-pressed", String(state.showDone));
  $("#showDone").addEventListener("click", toggleDone);
  $("#refresh").addEventListener("click", refresh);
  $("#newBtn").addEventListener("click", () => openCreate(null));
  $("#vList").addEventListener("click", () => setView("list"));
  $("#vBoard").addEventListener("click", () => setView("board"));
  $("#q").addEventListener("input", () => { state.filter = $("#q").value; renderMain(); });
  setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - lastRefresh > REFRESH_MS) refresh();
  });
  renderSide();
  setView(recall("view") === "board" ? "board" : "list");
  $("#title").textContent = whoLabel();
  await Promise.race([loadBoard(), new Promise((r) => setTimeout(r, 1500))]);
  loadList();
  loadPeople();
  api("myself").then((u) => { me = u; }).catch(() => {});
  api("priority/search?maxResults=50").then((r) => { priorities = r.values || []; }).catch(() => {});
  if (location.hash.length > 1) openIssue(decodeURIComponent(location.hash.slice(1)));
})();
</script>
